name: Build Mobile Saver APK
on:
  workflow_dispatch:
  push:
    branches: [Mobile-saver]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Build debug APK
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint
      - uses: actions/upload-artifact@v4
        with:
          name: InterTune-mobile-saver
          path: app/build/outputs/apk/core/debug/*.apk
